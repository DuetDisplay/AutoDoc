name: Clean old update packages
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible older packages and expired multipart uploads
        type: boolean
        default: false
concurrency:
  group: autodoc-public-update-mirror
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'DuetDisplay/AutoDoc' && vars.UPDATE_MIRROR_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: update-mirror-production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Clean eligible packages (latest and previous remain)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          UPDATE_MIRROR_BUCKET: autodoc-updates
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_MIRROR_R2_SECRET_ACCESS_KEY }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = 'true' ]; then args+=(--apply); fi
          node scripts/prune-update-mirror.mjs "${args[@]}"
