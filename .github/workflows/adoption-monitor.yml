name: Live adoption monitor

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/adoption-monitor.yml]

permissions: {}
concurrency:
  group: live-adoption-monitor
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'DuetDisplay/AutoDoc'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - name: Read GitHub counters and send authenticated aggregates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://autodoc-adoption-monitor.duetdisplay.workers.dev';
          const releases = [];
          for (let page = 1; page <= 5; page++) {
            const response = await fetch(`https://api.github.com/repos/DuetDisplay/AutoDoc/releases?per_page=100&page=${page}`, {
              headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'AutoDoc-adoption-monitor' },
              signal: AbortSignal.timeout(20000), redirect: 'error'
            });
            if (!response.ok) throw new Error(`GitHub counter read failed (${response.status})`);
            const rows = await response.json();
            releases.push(...rows);
            if (rows.length < 100) break;
            if (page === 5) throw new Error('Release pagination limit reached');
          }
          const stable = releases.filter(r => !r.draft && !r.prerelease && /^v?\d+\.\d+\.\d+$/.test(r.tag_name)).map(r => ({
            tag_name: r.tag_name, published_at: r.published_at, draft: false, prerelease: false,
            assets: r.assets.filter(a => /\.(dmg|exe)$/i.test(a.name)).map(a => ({id:a.id,name:a.name,download_count:a.download_count,browser_download_url:a.browser_download_url}))
          }));
          if (!stable.length) throw new Error('No stable releases');
          const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          oidcUrl.searchParams.set('audience', origin);
          const identityResponse = await fetch(oidcUrl, {headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},signal:AbortSignal.timeout(20000),redirect:'error'});
          if (!identityResponse.ok) throw new Error(`Workflow identity failed (${identityResponse.status})`);
          const identity = await identityResponse.json();
          if (!identity.value) throw new Error('Workflow identity missing');
          const upload = await fetch(origin + '/github-ingest', {
            method:'POST', headers:{Authorization:`Bearer ${identity.value}`,'Content-Type':'application/json'},
            body:JSON.stringify({releases:stable}),signal:AbortSignal.timeout(30000),redirect:'error'
          });
          if (!upload.ok) throw new Error(`Counter ingestion failed (${upload.status})`);
          console.log(`Collected installer counters from ${stable.length} stable releases.`);
          NODE
