# Internal Release — INTERNAL-ONLY workflow. Do NOT merge this file to the public
# AutoDoc repo; it exists only in the private AutoDoc-Internal fork.
#
# Produces unsigned internal QA prereleases and signed stable internal releases
# (via electron-builder.internal.yml overlay), publishing both to a generic
# HTTPS update feed hosted on Cloudflare R2.
#
# Required secrets:
#   INTERNAL_FEED_UPLOAD_TOKEN — bearer token for the feed uploader worker
#     (scripts/internal-update-feed-worker; rotate with `wrangler secret put
#     UPLOAD_TOKEN` there and update this GitHub secret to match)
#   (plus the signing secrets shared with build.yml)
#
# Tag formats:
#   internal-vX.Y.Z.N → unsigned QA app version X.Y.Z-internal.N
#   internal-vX.Y.Z   → signed stable app version X.Y.Z
#   e.g. internal-v1.1.0.7 → 1.1.0-internal.7

name: Internal Release

# SECURITY: Do not add pull_request — this workflow uses signing secrets.

on:
  push:
    tags:
      - 'internal-v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform(s) to build
        required: false
        default: all
        type: choice
        options:
          - mac
          - windows
          - all
      publish:
        description: Publish artifacts to the internal update feed
        required: false
        default: true
        type: boolean
      signed:
        description: Sign the build (use only for a stable internal release)
        required: false
        default: false
        type: boolean
      version:
        description: Version to stamp (e.g. 1.1.1-internal.1 or 1.1.1)
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  resolve-meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      signed: ${{ steps.meta.outputs.signed }}
      build_mac: ${{ steps.meta.outputs.build_mac }}
      build_win: ${{ steps.meta.outputs.build_win }}
    steps:
      - name: Resolve internal release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RAW_TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_SIGNED: ${{ inputs.signed }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            tag="${RAW_TAG#refs/tags/}"
            stripped="${tag#internal-v}"
            if [[ "$stripped" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="$stripped"
              signed='true'
            elif [[ "$stripped" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # internal-v1.1.0.7 → 1.1.0-internal.7
              version="${stripped%.*}-internal.${stripped##*.}"
              signed='false'
            else
              echo "::error::Tag '$tag' must match internal-vX.Y.Z (stable) or internal-vX.Y.Z.N (unsigned QA)." >&2
              exit 1
            fi
            publish='true'
            build_mac='true'
            build_win='true'
          else
            version="$INPUT_VERSION"
            signed="$INPUT_SIGNED"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-internal\.[0-9]+$ ]]; then
              if [ "$signed" = "true" ]; then
                echo "::error::Internal QA prereleases must be unsigned; use a stable X.Y.Z version for signed builds." >&2
                exit 1
              fi
            elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              if [ "$signed" != "true" ]; then
                echo "::error::Stable internal releases must set signed=true." >&2
                exit 1
              fi
            else
              echo "::error::Version '$version' must match X.Y.Z (stable) or X.Y.Z-internal.N (unsigned QA)." >&2
              exit 1
            fi
            publish="$INPUT_PUBLISH"
            if [ "$INPUT_PLATFORM" = "mac" ] || [ "$INPUT_PLATFORM" = "all" ]; then
              build_mac='true'
            else
              build_mac='false'
            fi
            if [ "$INPUT_PLATFORM" = "windows" ] || [ "$INPUT_PLATFORM" = "all" ]; then
              build_win='true'
            else
              build_win='false'
            fi
          fi

          echo "Resolved version: $version (signed=$signed publish=$publish mac=$build_mac win=$build_win)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "build_mac=$build_mac" >> "$GITHUB_OUTPUT"
          echo "build_win=$build_win" >> "$GITHUB_OUTPUT"

  release-mac:
    needs: resolve-meta
    if: needs.resolve-meta.outputs.build_mac == 'true'
    runs-on: macos-latest
    environment: ${{ needs.resolve-meta.outputs.signed == 'true' && 'release-signing' || 'internal-qa' }}
    permissions:
      contents: read
    env:
      AUTODOC_SENTRY_DSN: ${{ secrets.AUTODOC_SENTRY_DSN }}
      AUTODOC_SENTRY_QA_PROBE: ${{ github.repository == 'DuetDisplay/AutoDoc-Internal' && '1' || '' }}
      AUTODOC_OFFICIAL_BUILD: ${{ github.repository == 'DuetDisplay/AutoDoc' && '1' || '' }}
      AUTODOC_SUPPORT_EMAIL: team@getautodoc.com
      AUTODOC_AUTH_WORKER_URL: ${{ vars.AUTODOC_AUTH_WORKER_URL }}
      AUTODOC_MACOS_WHISPER_RUNTIME_ASSET_BASE_URL: ${{ vars.AUTODOC_MACOS_WHISPER_RUNTIME_ASSET_BASE_URL }}
      AUTODOC_WINDOWS_TRANSCRIPTION_ASSET_BASE_URL: ${{ vars.AUTODOC_WINDOWS_TRANSCRIPTION_ASSET_BASE_URL }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
      HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run bootstrap tests
        run: npm run test:main:run -- src/main/services/__tests__/whisper-manager.test.ts

      - name: Install Apple certificate
        if: needs.resolve-meta.outputs.signed == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.DD_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.DD_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.DD_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build macOS internal release (signed + notarized)
        if: needs.resolve-meta.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.DD_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DD_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DD_APPLE_TEAM }}
        run: |
          npm run prepare:macos-mlx-runtime
          npm run build
          npx electron-builder --mac --publish never --config electron-builder.internal.yml "-c.extraMetadata.version=${{ needs.resolve-meta.outputs.version }}"

      - name: Build macOS internal QA release (unsigned)
        if: needs.resolve-meta.outputs.signed != 'true'
        env:
          AUTODOC_SKIP_MAC_SIGNING: '1'
        run: |
          npm run prepare:macos-mlx-runtime
          npm run build
          npx electron-builder --mac --publish never --config electron-builder.internal.yml --config.mac.notarize=false -c.mac.identity=null "-c.extraMetadata.version=${{ needs.resolve-meta.outputs.version }}"

      - name: Verify macOS release artifacts (signature, entitlements, runtime)
        if: needs.resolve-meta.outputs.signed == 'true'
        env:
          AUTODOC_MAC_APP_NAME: AutoDoc Internal.app
        run: bash scripts/verify-macos-update-artifact.sh dist

      # electron-builder emits internal-mac.yml for QA prereleases and
      # latest-mac.yml for stable versions.
      - name: Upload macOS internal release assets
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: internal-release-macos-${{ needs.resolve-meta.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-mac.yml
          if-no-files-found: error
          retention-days: 14

  release-win:
    needs: resolve-meta
    if: needs.resolve-meta.outputs.build_win == 'true'
    runs-on: windows-2022
    environment: ${{ needs.resolve-meta.outputs.signed == 'true' && 'release-signing' || 'internal-qa' }}
    permissions:
      contents: read
    env:
      AUTODOC_SENTRY_DSN: ${{ secrets.AUTODOC_SENTRY_DSN }}
      AUTODOC_SENTRY_QA_PROBE: ${{ github.repository == 'DuetDisplay/AutoDoc-Internal' && '1' || '' }}
      AUTODOC_OFFICIAL_BUILD: ${{ github.repository == 'DuetDisplay/AutoDoc' && '1' || '' }}
      AUTODOC_SUPPORT_EMAIL: team@getautodoc.com
      AUTODOC_AUTH_WORKER_URL: ${{ vars.AUTODOC_AUTH_WORKER_URL }}
      AUTODOC_MACOS_WHISPER_RUNTIME_ASSET_BASE_URL: ${{ vars.AUTODOC_MACOS_WHISPER_RUNTIME_ASSET_BASE_URL }}
      AUTODOC_WINDOWS_TRANSCRIPTION_ASSET_BASE_URL: ${{ vars.AUTODOC_WINDOWS_TRANSCRIPTION_ASSET_BASE_URL }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
      HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run bootstrap tests
        shell: pwsh
        run: |
          npm run test:main:run -- src/main/services/__tests__/whisper-manager.test.ts
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Materialize DigiCert client certificate
        if: needs.resolve-meta.outputs.signed == 'true'
        shell: pwsh
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.DD_SM_CLIENT_CERT_FILE_B64 }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'Certificate_pkcs12.p12'
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64))
          "SM_CLIENT_CERT_FILE=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup DigiCert signing tools
        if: needs.resolve-meta.outputs.signed == 'true'
        uses: digicert/code-signing-software-trust-action@v1.2.1
        with:
          use-github-caching-service: true
        env:
          SM_HOST: https://clientauth.one.digicert.com
          SM_API_KEY: ${{ secrets.DD_SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.DD_SM_CLIENT_CERT_PASSWORD }}

      - name: Expose DigiCert tool paths
        if: needs.resolve-meta.outputs.signed == 'true'
        shell: pwsh
        run: |
          $candidatePaths = @()

          if ($env:LOCALAPPDATA) {
            $candidatePaths += Join-Path $env:LOCALAPPDATA 'Temp\smtools-windows-x64\smctl.exe'
          }

          $smctlCommand = Get-Command smctl.exe -ErrorAction SilentlyContinue
          if ($smctlCommand) {
            $candidatePaths += $smctlCommand.Source
          }

          if ($env:ProgramFiles) {
            $candidatePaths += Join-Path $env:ProgramFiles 'DigiCert\DigiCert One Signing Manager Tools\smctl.exe'
          }
          if (${env:ProgramFiles(x86)}) {
            $candidatePaths += Join-Path ${env:ProgramFiles(x86)} 'DigiCert\DigiCert One Signing Manager Tools\smctl.exe'
          }

          $smctlPath = $candidatePaths |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique -First 1

          if (-not $smctlPath) {
            throw 'smctl.exe was not found on PATH or in the standard DigiCert install locations.'
          }

          Write-Host "Resolved smctl.exe to $smctlPath"
          try {
            $versionInfo = (Get-Item $smctlPath).VersionInfo
            if ($versionInfo.FileVersion) {
              Write-Host "smctl.exe file version: $($versionInfo.FileVersion)"
            }
          } catch {
            Write-Warning "Unable to read smctl.exe file version: $($_.Exception.Message)"
          }

          $smToolsDir = Split-Path -Parent $smctlPath
          $smToolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SMCTL_PATH=$smctlPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $signToolCandidates = @()

          $signToolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signToolCommand) {
            $signToolCandidates += $signToolCommand.Source
          }

          if (${env:ProgramFiles(x86)}) {
            $windowsKitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
            $signToolCandidates += Join-Path $windowsKitsRoot 'App Certification Kit\signtool.exe'

            $windowsKitsBin = Join-Path $windowsKitsRoot 'bin'
            if (Test-Path $windowsKitsBin) {
              $signToolCandidates += Get-ChildItem -Path $windowsKitsBin -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -ExpandProperty FullName
            }
          }

          $signToolPath = $signToolCandidates |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique -First 1

          if (-not $signToolPath) {
            throw 'signtool.exe was not found on PATH or in the standard Windows SDK locations.'
          }

          Write-Host "Resolved signtool.exe to $signToolPath"
          try {
            $versionInfo = (Get-Item $signToolPath).VersionInfo
            if ($versionInfo.FileVersion) {
              Write-Host "signtool.exe file version: $($versionInfo.FileVersion)"
            }
          } catch {
            Write-Warning "Unable to read signtool.exe file version: $($_.Exception.Message)"
          }

          $signToolDir = Split-Path -Parent $signToolPath
          $signToolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SIGNTOOL_PATH=$signToolPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check DigiCert signing health
        if: needs.resolve-meta.outputs.signed == 'true'
        shell: pwsh
        env:
          SM_HOST: https://clientauth.one.digicert.com
          SM_API_KEY: ${{ secrets.DD_SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.DD_SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ secrets.DD_SM_KEYPAIR_ALIAS }}
          SM_LOG_LEVEL: TRACE
        run: |
          & $env:SMCTL_PATH healthcheck
          & $env:SMCTL_PATH windows certsync --keypair-alias=$env:SM_KEYPAIR_ALIAS --store=system

      - name: Build Windows internal release
        if: needs.resolve-meta.outputs.signed == 'true'
        env:
          REQUIRE_WINDOWS_SIGNING: 'true'
          SM_HOST: https://clientauth.one.digicert.com
          SM_API_KEY: ${{ secrets.DD_SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.DD_SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ secrets.DD_SM_KEYPAIR_ALIAS }}
          SM_LOG_LEVEL: TRACE
        run: |
          npm run build
          npx electron-builder --win --publish never --config electron-builder.internal.yml "-c.extraMetadata.version=${{ needs.resolve-meta.outputs.version }}"

      - name: Build Windows internal QA release (unsigned)
        if: needs.resolve-meta.outputs.signed != 'true'
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          npx electron-builder --win --publish never --config electron-builder.internal.yml --config.win.forceCodeSigning=false "-c.extraMetadata.version=${{ needs.resolve-meta.outputs.version }}"

      - name: Verify Windows signatures
        if: needs.resolve-meta.outputs.signed == 'true'
        shell: pwsh
        run: |
          # dist\autodoc-*.exe also matches internal installers (autodoc-internal-<version>-setup.exe);
          # the unpacked executable keeps the public name (executableName is unchanged).
          $files = @(
            'dist\win-unpacked\autodoc.exe'
            'dist\win-unpacked\resources\app.asar.unpacked\native\win-meeting-detector\bin\win-meeting-detector.exe'
            'dist\autodoc-*.exe'
          )

          $resolvedFiles = @()
          foreach ($pattern in $files) {
            $resolvedFiles += Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
          }

          if (-not $resolvedFiles) {
            throw 'No Windows artifacts were found to verify.'
          }

          $failed = $false
          foreach ($file in ($resolvedFiles | Sort-Object FullName -Unique)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            [pscustomobject]@{
              Path = $file.FullName
              Status = $signature.Status
              Signer = $signature.SignerCertificate.Subject
            } | Format-List

            if ($signature.Status -ne 'Valid') {
              $failed = $true
            }
          }

          if ($failed) {
            throw 'One or more Windows artifacts are not Authenticode-signed.'
          }

      - name: Capture DigiCert signing diagnostics
        if: needs.resolve-meta.outputs.signed == 'true' && failure()
        shell: pwsh
        run: |
          $diagnosticDir = Join-Path $env:RUNNER_TEMP 'digicert-signing-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnosticDir | Out-Null

          $candidateFiles = @(
            (Join-Path $env:USERPROFILE '.signingmanager\logs\smctl.log')
            (Join-Path $env:USERPROFILE '.signingmanager\logs\smksp.log')
            (Join-Path $env:USERPROFILE '.signingmanager\logs\smcsp.log')
            (Join-Path $env:USERPROFILE '.signingmanager\logs\smpkcs11.log')
          ) | Where-Object { $_ }

          foreach ($candidate in $candidateFiles) {
            if (Test-Path $candidate) {
              Copy-Item -Path $candidate -Destination $diagnosticDir -Force
            }
          }

          [pscustomobject]@{
            SmctlPath = $env:SMCTL_PATH
            SmctlExists = [bool]($env:SMCTL_PATH -and (Test-Path $env:SMCTL_PATH))
            UserProfile = $env:USERPROFILE
            SigningLogDir = Join-Path $env:USERPROFILE '.signingmanager\logs'
          } | ConvertTo-Json | Out-File -FilePath (Join-Path $diagnosticDir 'environment.json') -Encoding utf8

      - name: Upload DigiCert signing diagnostics
        if: needs.resolve-meta.outputs.signed == 'true' && failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digicert-signing-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/digicert-signing-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows internal release assets
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: internal-release-windows-${{ needs.resolve-meta.outputs.version }}
          path: |
            dist/*-setup.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 14

  publish-feed:
    if: >-
      ${{
        always() &&
        needs.resolve-meta.result == 'success' &&
        needs.resolve-meta.outputs.publish == 'true' &&
        (needs.release-mac.result == 'success' || needs.release-mac.result == 'skipped') &&
        (needs.release-win.result == 'success' || needs.release-win.result == 'skipped') &&
        (needs.release-mac.result == 'success' || needs.release-win.result == 'success')
      }}
    runs-on: ubuntu-latest
    needs:
      - resolve-meta
      - release-mac
      - release-win
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download macOS internal release assets
        if: needs.release-mac.result == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          name: internal-release-macos-${{ needs.resolve-meta.outputs.version }}
          path: release-assets/mac

      - name: Download Windows internal release assets
        if: needs.release-win.result == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          name: internal-release-windows-${{ needs.resolve-meta.outputs.version }}
          path: release-assets/win

      - name: Publish assets to the internal update feed (R2 via uploader worker)
        env:
          UPLOAD_URL: https://autodoc-internal-updates-uploader.duetdisplay.workers.dev
          UPLOAD_TOKEN: ${{ secrets.INTERNAL_FEED_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail

          # Upload ordering matters: binaries (installers/zips/dmgs) go up FIRST and the
          # Feed metadata (internal.yml / internal-mac.yml for QA, or latest.yml /
          # latest-mac.yml for stable) goes up LAST, so the feed never advertises
          # a version whose binary has not been uploaded yet.

          if [ -d release-assets/mac ]; then
            mac_manifest="$(find release-assets/mac -maxdepth 1 -type f -name '*-mac.yml' -print -quit || true)"
            for file in release-assets/mac/*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              if [ "$file" = "$mac_manifest" ]; then
                continue
              fi
              bash scripts/upload-internal-feed.sh "$file" "mac/$name"
            done
            if [ -n "$mac_manifest" ]; then
              bash scripts/upload-internal-feed.sh "$mac_manifest" \
                "mac/$(basename "$mac_manifest")" text/yaml
            fi
          fi

          if [ -d release-assets/win ]; then
            win_manifest="$(find release-assets/win -maxdepth 1 -type f -name '*.yml' -print -quit || true)"
            for file in release-assets/win/*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              if [ "$file" = "$win_manifest" ]; then
                continue
              fi
              bash scripts/upload-internal-feed.sh "$file" "windows/$name"
            done
            if [ -n "$win_manifest" ]; then
              bash scripts/upload-internal-feed.sh "$win_manifest" \
                "windows/$(basename "$win_manifest")" text/yaml
            fi
          fi

      - name: Create internal GitHub release (record-keeping)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=()
          if [ -d release-assets/mac ]; then
            assets+=(release-assets/mac/*)
          fi
          if [ -d release-assets/win ]; then
            assets+=(release-assets/win/*)
          fi

          if gh release view "$RELEASE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber -R "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TAG" -R "$GH_REPO"
          fi
