name: Socket Security

# The Socket GitHub app handles PR checks; this workflow maintains the inventory.
on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - worker/package.json
      - worker/package-lock.json
  schedule:
    # 03:00 UTC is 10 PM EST / 11 PM EDT on the previous day in New York.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: socket-scan-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  socket-security:
    name: Socket Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Socket API key is configured
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -z "$SOCKET_SECURITY_API_KEY" ]; then
            echo "Missing GitHub Actions secret: SOCKET_SECURITY_API_KEY"
            echo "Create it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Socket CLI
        run: pip install socketsecurity --upgrade

      - name: Run Socket scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ github.token }}
        run: |
          # socketcli only full-scans push and workflow_dispatch. schedule logs
          # "Unknown event type schedule" and exits 0 before any inventory scan.
          # A push with no PR number is that full-scan path.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            export GITHUB_EVENT_NAME=push
          fi

          # Match the public repository already tracked by the Socket GitHub app.
          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --repo AutoDoc \
            --workspace Autodoc-Local \
            --owner DuetDisplay \
            --repo-is-public \
            --scm github \
            --pr-number 0
