name: Publish stable update mirror

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to mirror
        required: true
        type: string
      apply:
        description: Upload verified packages and advance stable manifests
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      apply:
        default: true
        type: boolean
      from_build_artifacts:
        default: false
        type: boolean

concurrency:
  # Shared across tag builds, manually published drafts, and recovery runs.
  group: autodoc-public-update-mirror
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'DuetDisplay/AutoDoc' && vars.UPDATE_MIRROR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: update-mirror-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch the published release and its signed update assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          FROM_BUILD_ARTIFACTS: ${{ inputs.from_build_artifacts || false }}
        run: |
          mkdir -p mirror-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          if jq -e '.draft or .prerelease' release.json >/dev/null; then
            echo 'Draft/prerelease: skipping stable mirror.'
            exit 0
          fi
          if [ "$FROM_BUILD_ARTIFACTS" != 'true' ]; then
            gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -D mirror-assets \
              -p 'latest*.yml' -p '*.zip' -p '*.exe'
          fi
      - name: Reuse verified macOS build artifacts
        if: inputs.from_build_artifacts == true
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-macos-${{ inputs.release_tag }}
          path: mirror-assets
      - name: Reuse verified Windows build artifacts
        if: inputs.from_build_artifacts == true
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-windows-${{ inputs.release_tag }}
          path: mirror-assets
      - name: Validate checksums and publish packages before manifests
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          UPDATE_MIRROR_ORIGIN: ${{ vars.UPDATE_MIRROR_ORIGIN }}
          UPDATE_MIRROR_BUCKET: autodoc-updates
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_MIRROR_R2_SECRET_ACCESS_KEY }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = 'true' ]; then args+=(--apply); fi
          node scripts/update-mirror.mjs release.json mirror-assets "${args[@]}"
