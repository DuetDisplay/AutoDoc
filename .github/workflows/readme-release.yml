name: Update README Release

on:
  release:
    types: [published, edited]
  # Releases created with GITHUB_TOKEN do not emit another release workflow.
  # Following the trusted build workflow covers that publication path too.
  workflow_run:
    workflows: ['Build & Release']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: readme-latest-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-readme:
    if: >-
      github.repository == 'DuetDisplay/AutoDoc' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # Always execute the default branch's script, never a release tag or
          # workflow-run artifact. The release supplies data only.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Generate announcement from the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          node scripts/sync-readme-release.mjs --release-json "$RUNNER_TEMP/latest-release.json"
          npm run test:readme-release-links

      - name: Open or update the README pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.RELEASE_DOCS_TOKEN || github.token }}
          add-paths: README.md
          branch: codex/readme-latest-release
          commit-message: 'docs: refresh the latest release announcement'
          title: 'Refresh the README latest release announcement'
          body: |
            Generate a short README teaser from the latest published stable GitHub release notes. The teaser uses the opening summary and feature headings, with a limit of 16 words and 120 characters. Review the wording alongside the full release notes; all download and release-note links continue to use `/releases/latest`.

            Generated by the Update README Release workflow. Review and merge through the normal protected-branch process.
