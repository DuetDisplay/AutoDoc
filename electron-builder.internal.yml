# INTERNAL-ONLY electron-builder update-feed overlay.
# This file must never be merged to the public AutoDoc repo.
# Internal builds must always pass: --config electron-builder.internal.yml
#
# Preserve the normal AutoDoc product name, package name, app ID, executable,
# profile, and installer identity inherited from electron-builder.yml. Only the
# update destination and feed-safe macOS artifact naming differ internally.
extends: ./electron-builder.yml
# Top-level publish override so no code path ever falls back to the base
# config's github publish block (which would bake the public GitHub feed
# into app-update.yml inside the installed app). Declared as a list so it
# REPLACES the base's publish object instead of deep-merging with it
# (deepAssign would otherwise leave owner/repo/releaseType leaking in).
publish:
  - provider: generic
    url: 'https://updates-internal.getautodoc.com/windows/'
win:
  publish:
    - provider: generic
      url: 'https://updates-internal.getautodoc.com/windows/'
mac:
  # Keep update-feed asset names deterministic across architectures.
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  publish:
    - provider: generic
      url: 'https://updates-internal.getautodoc.com/mac/'
